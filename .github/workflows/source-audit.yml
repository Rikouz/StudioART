name: Código y recursos
on: [push, pull_request]
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Revisa recursos versionados
        run: python3 qa/qa_source_release.py --tracked
      - name: Integridad
        run: python3 scripts/qa_static.py --root .
      - name: Biblioteca
        run: node qa/library_persistence.cjs
      - name: Cámara
        run: node qa/camera_revision.cjs
      - name: Carrusel
        run: node qa/carousel_revision.cjs
